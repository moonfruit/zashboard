name: Fork CI

on:
  push:
    branches:
      - moonfruit
  pull_request:
    branches:
      - moonfruit

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
      - uses: pnpm/action-setup@v6

      - name: Install
        run: pnpm i

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm exec eslint .

      - name: Build
        run: pnpm build
