name: Fork CI

on:
  push:
    branches:
      - moonfruit
  pull_request:
    branches:
      - moonfruit

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
      - uses: pnpm/action-setup@v6

      - name: Install
        run: pnpm i

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm exec eslint .

      - name: Build
        run: pnpm build

      - name: Check main chunk has no gRPC client
        run: |
          set +e
          ls dist/assets/index-*.js > /dev/null || exit 1
          grep -qE "grpc-websockets|application/grpc-web" dist/assets/index-*.js
          test $? -eq 1

      - name: Install fork proto
        run: pnpm -C fork-proto i

      - name: Check generated code
        run: |
          pnpm -C fork-proto generate
          git diff --exit-code -- src/assembly/singbox/api/gen
          test -z "$(git status --porcelain -- src/assembly/singbox/api/gen)"

      - name: Install fork tests
        run: pnpm -C fork-test i

      - name: Fork tests type check
        run: pnpm -C fork-test type-check

      - name: Fork tests
        run: pnpm -C fork-test test
